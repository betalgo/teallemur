<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inbox · empty</title>
<meta name="design:order" content="20">
<meta name="design:note" content="A new account before its first note. One clear way forward.">
<link rel="stylesheet" href="../../design-system/tokens.css">
<link rel="stylesheet" href="../../design-system/components.css">
<link rel="stylesheet" href="../_shared/app.css">
</head>
<body>
<div class="app">
  <nav class="sidebar" aria-label="Notebooks">
    <div class="brand"><img src="../../design-system/assets/logo.svg" alt="" width="28" height="28"> Harbor</div>
    <a class="button button--primary button--wide" href="note--default.html">New note</a>
    <ul class="notebooks">
      <li><a href="#" aria-current="page">All notes <span class="count">0</span></a></li>
      <li><a href="#">Pinned <span class="count">0</span></a></li>
      <li><a href="#">Shared with me <span class="count">0</span></a></li>
    </ul>
  </nav>

  <section class="list" aria-label="Notes">
    <div class="list__head">
      <h1>All notes</h1>
    </div>
    <div class="empty">
      <svg width="72" height="72" viewBox="0 0 72 72" aria-hidden="true"><rect x="14" y="10" width="44" height="52" rx="8" stroke="currentColor" stroke-width="3" fill="none"/><path d="M24 26h24M24 36h24M24 46h14" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
      <h2>Your first note</h2>
      <p>Write down what's on your mind, or paste a link to come back to later. Notes save as you type.</p>
      <a class="button button--primary" href="note--default.html">Write a note</a>
    </div>
  </section>

  <article class="note note--beside-list" aria-label="No note open"></article>
</div>
</body>
</html>
