<!doctype html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · default</title>
<meta name="design:order" content="10">
<meta name="design:links" content=".button--primary -> notes/inbox--default">
<link rel="stylesheet" href="../../design-system/tokens.css">

<body>
<main class="auth">
  <form class="auth__card">
    <div class="auth__brand"><img src="../../design-system/assets/logo.svg" alt="" width="40" height="40"></div>
    <h1>Welcome back</h1>
    <p class="hint">Sign in to pick up where you left off.</p>
    <label class="field">Email <input class="input" type="email" value="alex@example.com"></label>
    <label class="field">Password <input class="input" type="password" value="correct horse"></label>
    <button class="button button--primary button--wide" type="submit">Sign in</button>
    <p class="hint auth__foot">New to Harbor? <a href="#">Create an account</a></p>
  </form>
</main>
