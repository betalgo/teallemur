<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Button · kinds</title>

<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components.css">
<style>
  .row { display: flex; gap: var(--space-m); align-items: center; padding: var(--space-xl); }

  <button class="button button--primary" type="button">New note</button>

</div>
