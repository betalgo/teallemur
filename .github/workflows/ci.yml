name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref so no runner does wasted work.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          package-manager-cache: false

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  design:
    name: design:check
    # Company decision 0023: the copied and transcribed design files must match the pinned commit of the
    # private design repo. Pull requests from forks and from Dependabot get no secrets, so they skip it;
    # every push to main, and every pull request from this repo's own branches, runs it.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Read the design pin
        id: pin
        env:
          DESIGN_REPOS_READ_TOKEN: ${{ secrets.DESIGN_REPOS_READ_TOKEN }}
        run: |
          if [ -z "${DESIGN_REPOS_READ_TOKEN}" ]; then
            echo "::error::The repository secret DESIGN_REPOS_READ_TOKEN is not set, so CI cannot read the design repo."
            exit 1
          fi
          node --input-type=module <<'JS'
          import { appendFileSync, readFileSync } from 'node:fs';
          const pin = JSON.parse(readFileSync('design-source.json', 'utf8'));
          if (pin.repository !== 'betalgo/designroom-design' || !/^[0-9a-f]{40}$/.test(pin.commit)) throw new Error('Invalid design pin');
          const paths = [...new Set([...(pin.files ?? []), ...(pin.transcribed ?? [])].map((entry) => entry.from))];
          if (!paths.length || paths.some((path) => !/^[\w.,[\]-]+(\/[\w.,[\]-]+)*$/.test(path))) throw new Error('Invalid design file path');
          // Sparse-checkout patterns: anchored at the root, with [ and ] escaped so they match literally.
          const patterns = paths.map((path) => `/${path.replace(/[[\]]/g, '\\$&')}`);
          appendFileSync(process.env.GITHUB_OUTPUT, `commit=${pin.commit}\npaths<<PATHS\n${patterns.join('\n')}\nPATHS\n`);
          JS

      # The history without file contents, plus only the pinned files, instead of the whole design repo.
      - name: Check out the design repo at the pinned commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: betalgo/designroom-design
          ref: ${{ steps.pin.outputs.commit }}
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: ${{ steps.pin.outputs.paths }}
          sparse-checkout-cone-mode: false
          token: ${{ secrets.DESIGN_REPOS_READ_TOKEN }}
          persist-credentials: false
          path: .design-source

      - name: Compare the viewer's design files with the pin
        run: node scripts/design-source.ts check .design-source
